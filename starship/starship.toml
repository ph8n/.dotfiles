"$schema" = 'https://starship.rs/config-schema.json'

# Do not let Git status scans in huge repos (notably llvm-project) block the prompt.
command_timeout = 100
palette = "mfd-mono"

format = """
${custom.nix_flake_inside}\
${custom.nix_flake_outside}\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$character"""

[hostname]
ssh_only = true
format = "[@$hostname]($style) "
style = "mfd_bright"

[directory]
style = "mfd_bright"
read_only_style = "bold mfd_red"

[character]
success_symbol = "[❯](bold mfd_green)"
error_symbol = "[❯](bold mfd_red)"
vimcmd_symbol = "[❮](bold mfd_green)"
vimcmd_replace_one_symbol = "[❮](bold mfd_green)"
vimcmd_replace_symbol = "[❮](bold mfd_green)"
vimcmd_visual_symbol = "[❮](bold mfd_green)"

[git_branch]
format = "[on](mfd_bright) [$symbol$branch]($style) "
symbol = " "
style = "bold mfd_bright"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold mfd_red"
conflicted = "="
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
stashed = '\$'
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
up_to_date = ""

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "mfd_bright"

[cmd_duration]
format = "[$duration]($style) "
style = "mfd_bright"

[custom.nix_flake_inside]
when = '''test -n "$IN_NIX_SHELL" && test -n "$NIX_FLAKE_ROOT" && case "$PWD/" in "$NIX_FLAKE_ROOT/"*) true ;; *) false ;; esac'''
command = "printf λ"
format = "[$output]($style) "
style = "bold mfd_green"
shell = ["sh"]

[custom.nix_flake_outside]
when = '''test -n "$IN_NIX_SHELL" && { test -z "$NIX_FLAKE_ROOT" || case "$PWD/" in "$NIX_FLAKE_ROOT/"*) false ;; *) true ;; esac; }'''
command = "printf λ"
format = "[$output]($style) "
style = "bold mfd_red"
shell = ["sh"]

[lua]
disabled = true

[python]
disabled = true

[palettes.mfd-mono]
mfd_bg = "#0A0B0A"
mfd_bright = "#F4F4FF"
mfd_red = "#F36C7A"
mfd_green = "#7DCE8C"
