# Concurrent agents and language servers can exhaust Ubuntu's conservative
# inotify defaults. Memory is allocated only for watches that are actually used.
fs.inotify.max_user_instances = 1024
fs.inotify.max_user_watches = 1048576
fs.inotify.max_queued_events = 32768

# Redis uses fork-based background persistence and requires overcommit so the
# child can start even though most copy-on-write pages will remain shared.
vm.overcommit_memory = 1
