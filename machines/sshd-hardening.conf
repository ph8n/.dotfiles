# OpenSSH is reached through Tailscale. Client keys provide the inner SSH
# authentication used by SFTP and remote development.
AllowUsers phongndo
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no

# Keep remote development features while reducing authentication exposure.
AllowTcpForwarding yes
X11Forwarding no
UseDNS no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 60
ClientAliveCountMax 3
