# hunk configuration
# Per Hunk's README, `theme` is the persisted named theme preference.
# `pho` is added by ~/.config/hunk/build-pho.sh; stock Hunk only ships
# graphite, midnight, paper, and ember.
theme = "pho"
mode = "auto"
line_numbers = true
wrap_lines = false
hunk_headers = true
agent_notes = false
